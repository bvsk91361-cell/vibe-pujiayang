name: Course CI
on:
  push:
    branches: [master, main, 'feat/**']
    tags: ['day*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Business rules and API tests
        run: npm test
      - name: Coursework evidence gate
        run: python ci_check.py --day 6 --name 蒲嘉洋
