<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>借一下 · 校园器材预约</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
  <header class="topbar"><a class="brand" href="/">▧ 借一下<span>校园器材预约</span></a><span class="course">蒲嘉洋 · Vibe Coding 实践</span></header>
  <main>
    <section class="hero"><div><span class="eyebrow">让好设备，用在好点子上</span><h1>你的下一次创作，<br>从这里借出发。</h1><p>选器材，定时间。预约和归还，都有迹可循。</p></div><div class="hero-visual" aria-hidden="true"><span class="orbit">✦</span><div class="hero-camera">📷</div><span class="visual-label">READY FOR YOUR IDEAS</span></div></section>
    <section aria-labelledby="equipment-title"><div class="section-heading"><div><span class="eyebrow">01 / 选择设备</span><h2 id="equipment-title">今天，想借点什么？</h2></div><span class="hint">3 件器材 · 3 个每日时段</span></div><div id="equipment" class="cards"></div></section>
    <section class="booking-section" aria-labelledby="booking-title"><div><span class="eyebrow">02 / 留下你的时间</span><h2 id="booking-title">安排一次预约</h2><p>同一器材、同一日期、同一时段只能预约一次。</p><div class="selection" id="selection">已选：数码相机</div></div><form id="booking-form"><div class="form-grid"><label>预约人<input name="name" value="蒲嘉洋" maxlength="30" required autocomplete="name"></label><label>预约日期<input type="date" name="date" required></label><label>器材<select name="equipmentId" required></select></label><label>预约时段<select name="slot" required></select></label></div><button class="primary" type="submit">确认预约 <span>↗</span></button><p id="message" role="status" aria-live="polite"></p></form></section>
    <section aria-labelledby="reservations-title"><div class="section-heading"><div><span class="eyebrow">03 / 查看安排</span><h2 id="reservations-title">预约记录</h2></div><button id="refresh" class="text-button" type="button">刷新记录 ↻</button></div><div id="reservations" class="reservation-list"></div></section>
  </main><footer>借一下 / 蒲嘉洋 · 第 10 组 <span>课程原型 · 本机共享预约记录，尚未提供用户登录</span></footer>
</body></html>
